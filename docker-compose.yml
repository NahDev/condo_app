services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condo
      POSTGRES_PASSWORD: condo
      POSTGRES_DB: condo_app
    ports:
      - "5432:5432"
    volumes:
      - condo_postgres_data:/var/lib/postgresql/data

volumes:
  condo_postgres_data:
